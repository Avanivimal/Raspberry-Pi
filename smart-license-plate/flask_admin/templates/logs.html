<!-- logs.html -->
<!DOCTYPE html>
<html>
<head>
    <title>License Plate Logs</title>
    <meta http-equiv="refresh" content="5">
    <style>
        body { font-family: Arial, sans-serif; }
 
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px;
        }
 
        .buttons a, .buttons button {
            text-decoration: none;
            color: white;
            background-color: #3498db;
            padding: 8px 12px;
            margin-left: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
 
        .buttons button:hover, .buttons a:hover { background-color: #2980b9; }
        .logout a {
            text-decoration: none;
            color: white;
            background-color: #e74c3c;
            padding: 8px 12px;
            border-radius: 5px;
        }
 
        .logout a:hover { background-color: #c0392b; }
 
        .search-bar { text-align: center; margin-top: 10px; }
 
        .search-bar input[type="text"] {
            padding: 8px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
 
        .search-bar button {
            padding: 8px 12px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 5px;
            cursor: pointer;
        }
 
        .search-bar button:hover { background-color: #001f4d; }
 
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 95%;
        }
 
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
 
        th { background-color: #f0f0f0; }
 
        img.snapshot-thumbnail {
            max-width: 100px;
            max-height: 80px;
        }
 
        button.delete-button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
 
        button.delete-button:hover { background-color: #c0392b; }
    </style>
</head>
<body>
 
<div class="top-bar">
    <div class="buttons">
        <button onclick="startDetection()">▶ Start Detection</button>
        <button onclick="stopDetection()">⏹ Stop Detection</button>
        <a href="/export">📤 Export Logs</a>
    </div>
    <div class="logout">
        <a href="/logout">🔒 Logout</a>
    </div>
</div>
 
<h2 style="text-align:center;">Detected License Plate Logs</h2>
 
<div class="search-bar">
    <form method="get" action="{{ url_for('logs') }}">
        <input type="text" name="query" placeholder="Search by plate or time..." value="{{ query or '' }}">
        <button type="submit">🔍 Search</button>
    </form>
</div>
 
<table>
    <tr>
        <th>Plate</th>
        <th>Timestamp</th>
        <th>Confidence</th>
        <th>Snapshot</th>
        <th>Delete</th>
    </tr>
    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ "%.2f"|format(row[2]) }}</td>
        <td>
            {% if row[3] %}
                <a href="{{ url_for('snapshots', filename=row[3].replace('\\', '/').rsplit('/', 1)[-1]) }}" target="_blank">
                    <img src="{{ url_for('snapshots', filename=row[3].replace('\\', '/').rsplit('/', 1)[-1]) }}" alt="snapshot" class="snapshot-thumbnail">
                </a>
            {% else %} N/A {% endif %}
        </td>
        <td>
            <form method="POST" action="{{ url_for('delete_log', log_id=row[4]) }}" onsubmit="return confirm('Are you sure you want to delete this log?');">
                <button type="submit" class="delete-button">🗑 Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
 
<script>
    async function startDetection() {
        const response = await fetch("/start");
        const data = await response.json();
        alert(data.status === "started" ? "✅ Detection started." : "⚠️ Detection is already running.");
    }
 
    async function stopDetection() {
        const response = await fetch("/stop");
        const data = await response.json();
        alert(data.status === "stopped" ? "🛑 Detection stopped." : "⚠️ No detection process is running.");
    }
</script>
 
</body>
</html>
